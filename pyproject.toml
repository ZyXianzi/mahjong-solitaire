[project]
name = "mahjong-solitaire"
version = "1.0.0"
description = "A relaxing yet challenging Mahjong Solitaire game with beautifully styled tile art and multiple layouts to choose from. Every board is generated to be solvable, so the puzzle is always about strategy, patience, and finding the right matching pairs. Use hints, undo mistakes, avoid deadlocks, and clear the table one pair at a time."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.7",
]
